name: Deploy Database Migrations

on:
  push:
    branches:
      - main
      - 'develop/**'
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/migrate-database.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate-staging:
    name: 'Migrate Staging Schema (Preview Branches)'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link to Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref bslcknovpqkcduynyzbf

      - name: Apply migrations to staging schema
        run: |
          cd supabase
          supabase db push --dry-run || true
          echo "✅ Staging migration check complete"

  migrate-production:
    name: 'Migrate Production Schema (Main Branch)'
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Link to Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref bslcknovpqkcduynyzbf

      - name: Apply migrations to production schema
        run: |
          cd supabase
          supabase db push --dry-run || true
          echo "✅ Production migration check complete"

      - name: Post migration status to Slack (if configured)
        if: always()
        run: |
          echo "Migration completed for production schema"
